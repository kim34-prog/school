<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>데이터 분석</title>
  <style>
    :root {
      --blue-900: #0b2a5b;
      --blue-700: #1458c4;
      --blue-500: #2f7df6;
      --blue-100: #e3efff;
      --blue-50:  #f3f8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: var(--blue-50);
      color: var(--blue-900);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--blue-900), var(--blue-500));
      color: #fff;
      text-align: center;
      padding: 56px 20px 48px;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    header p {
      margin: 0 auto;
      max-width: 560px;
      font-size: 1.05rem;
      opacity: 0.92;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 36px 20px 56px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      display: block;
      background: #fff;
      border: 1px solid var(--blue-100);
      border-radius: 16px;
      padding: 28px 22px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 12px rgba(20, 88, 196, 0.08);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(20, 88, 196, 0.18);
      border-color: var(--blue-500);
      outline: none;
    }

    .num {
      display: inline-block;
      width: 36px;
      height: 36px;
      line-height: 36px;
      text-align: center;
      border-radius: 50%;
      background: var(--blue-700);
      color: #fff;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 1.3rem;
      color: var(--blue-700);
    }

    .card span {
      font-size: 0.92rem;
      color: #5b7aa8;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: #5b7aa8;
    }

    @media (max-width: 480px) {
      header { padding: 40px 16px 34px; }
      header h1 { font-size: 1.7rem; }
      main { padding: 24px 16px 40px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>데이터 분석</h1>
    <p>공공데이터와 여러 분석 도구로 숫자 속 이야기를 찾아낸 작품들을 모아 놓은 갤러리입니다.</p>
  </header>

  <main>
    <div class="grid">

      <a class="card" href="pdf/flourish-marine-accidents-public-data-visualization.pdf" target="_blank" rel="noopener">
        <div class="num">1</div>
        <h2>데이터</h2>
        <span>Flourish로 보는 해양사고 시각화 · PDF 열기</span>
      </a>

      <a class="card" href="pdf/codap-pokemon-data-analysis-report.pdf" target="_blank" rel="noopener">
        <div class="num">2</div>
        <h2>포켓몬</h2>
        <span>CODAP 포켓몬 데이터 분석 · PDF 열기</span>
      </a>

      <a class="card" href="pdf/orange3-linear-regression-ship-tonnage-accidents.pdf" target="_blank" rel="noopener">
        <div class="num">3</div>
        <h2>오렌지</h2>
        <span>Orange3 선형 회귀 탐구 · PDF 열기</span>
      </a>

    </div>
  </main>

  <footer>카드를 누르면 PDF가 새 창에서 열려요.</footer>

</body>
</html>
